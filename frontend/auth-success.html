<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareLink — Signing you in...</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      flex-direction: column;
      gap: 20px;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(0,212,170,0.15);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: var(--font-display);
    }
    .auth-sub {
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="auth-title">Signing you in with Google...</div>
  <div class="auth-sub" id="authStatus">Please wait a moment ✨</div>

  <script>
    /**
     * SECURITY: This page NEVER reads a token from the URL.
     * The httpOnly auth cookie was already set by the backend before redirecting here.
     * We simply call /api/auth/me — the browser sends the cookie automatically.
     */
    (async function () {
      const IS_PROD = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
      const BACKEND_URL = IS_PROD ? 'https://carelink-api-3vzd.onrender.com' : '';

      // Safety check: if someone lands here with ?error= param from OAuth failure
      const params = new URLSearchParams(window.location.search);
      if (params.get('error')) {
        document.getElementById('authStatus').textContent = '❌ Google sign-in failed. Redirecting...';
        setTimeout(() => window.location.href = '/?error=1', 2000);
        return;
      }

      try {
        // Fetch the current user using the httpOnly cookie set by the backend
        const res = await fetch(`${BACKEND_URL}/api/auth/me`, {
          method: 'GET',
          credentials: 'include',  // Sends the httpOnly cookie automatically
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) {
          document.getElementById('authStatus').textContent = '❌ Authentication failed. Redirecting...';
          setTimeout(() => window.location.href = '/', 2000);
          return;
        }

        const data = await res.json();
        if (!data.authenticated || !data.user) {
          document.getElementById('authStatus').textContent = '❌ Session invalid. Redirecting...';
          setTimeout(() => window.location.href = '/', 2000);
          return;
        }

        const user = data.user;
        document.getElementById('authStatus').textContent = `✅ Welcome, ${user.name}! Redirecting...`;

        // Redirect to the correct portal based on server-authoritative role
        setTimeout(() => {
          const portals = {
            patient:   'patient.html',
            doctor:    'doctor.html',
            admin:     'admin.html',
            lab:       'lab.html',
            pharmacy:  'pharmacy.html',
            insurance: 'insurance.html',
            emergency: 'emergency.html',
            hospital:  'admin.html'
          };
          window.location.href = portals[user.role] || 'index.html';
        }, 800);

      } catch (e) {
        document.getElementById('authStatus').textContent = '❌ Something went wrong. Redirecting...';
        setTimeout(() => window.location.href = '/', 2000);
      }
    })();
  </script>
</body>
</html>
