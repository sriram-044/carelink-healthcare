<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareLink — Insurance Portal</title>
  <meta name="description" content="CareLink Insurance Portal: Policy claims verification, document checks, and cashless approvals." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🛡️</div>
        <div>
          <div class="logo-text">MediLink AI</div>
          <div class="logo-subtitle">Insurance Portal</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a class="nav-item active" href="#">
          <span class="nav-icon">🛡️</span> Claims & Verification
        </a>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">I</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">Insurance Officer</div>
          <div class="user-role">insurance</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Logout">⏻</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <div class="topbar-title">🛡️ Health Insurance Claims & Verification</div>
          <div class="topbar-subtitle">Authorized medical dossiers & claim approval queue</div>
        </div>
      </div>

      <div class="page-content">
        <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 20px;">
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--primary),var(--secondary));">
            <div class="stat-icon">📄</div>
            <div class="stat-value" id="statTotalClaims">0</div>
            <div class="stat-label">Total Claims</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--warning),#e17055);">
            <div class="stat-icon">⏳</div>
            <div class="stat-value" id="statPendingClaims" style="color:var(--warning)">0</div>
            <div class="stat-label">Pending Verification</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--status-normal),#00b894);">
            <div class="stat-icon">✅</div>
            <div class="stat-value" id="statApprovedClaims" style="color:var(--status-normal)">0</div>
            <div class="stat-label">Approved Claims</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--danger),#c0392b);">
            <div class="stat-icon">❌</div>
            <div class="stat-value" id="statRejectedClaims" style="color:var(--danger)">0</div>
            <div class="stat-label">Rejected / Flagged</div>
          </div>
        </div>

        <div class="card mb-20">
          <div class="card-header">
            <div class="card-title">🛡️ Insurance Claims Queue</div>
            <button class="btn btn-ghost btn-sm" onclick="loadInsuranceClaims()">↻ Refresh Queue</button>
          </div>
          <div id="claimsList" style="display:flex; flex-direction:column; gap:14px;">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth('insurance');
      if (!user) return;
      initSidebar();
      loadInsuranceClaims();
    });

    async function loadInsuranceClaims() {
      const res = await apiRequest('/insurance/claims');
      const container = document.getElementById('claimsList');
      if (!res || !res.ok || !res.data.length) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">🛡️</div><div class="empty-text">No active insurance claims submitted</div></div>';
        return;
      }

      const claims = res.data;
      const pending = claims.filter(c => c.status === 'Pending').length;
      const approved = claims.filter(c => c.status === 'Approved').length;
      const rejected = claims.filter(c => c.status === 'Rejected').length;

      document.getElementById('statTotalClaims').textContent = claims.length;
      document.getElementById('statPendingClaims').textContent = pending;
      document.getElementById('statApprovedClaims').textContent = approved;
      document.getElementById('statRejectedClaims').textContent = rejected;

      container.innerHTML = claims.map(c => `
        <div class="card" style="background:rgba(17,28,45,0.6); border-left:4px solid ${c.status === 'Approved' ? 'var(--status-normal)' : c.status === 'Rejected' ? 'var(--danger)' : 'var(--warning)'}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <div style="font-size:16px; font-weight:700; color:var(--text-primary);">
                Claim #${c.claimId} — <span style="color:var(--primary)">₹${c.claimAmount?.toLocaleString('en-IN')}</span>
              </div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                Policy #: <strong>${c.policyNumber}</strong> • Hospital: <strong>${c.hospitalName}</strong>
              </div>
              <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">
                Patient: <strong>${c.patientId?.name || 'Unknown'}</strong> (Age ${c.patientId?.age || '—'})
              </div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
                Treatment: "${c.treatmentDescription || 'Hospital admission & medical workup'}"
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <span class="badge ${c.status === 'Approved' ? 'badge-normal' : c.status === 'Rejected' ? 'badge-critical' : 'badge-pending'}">${c.status}</span>
              ${c.status === 'Pending' ? `
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-primary btn-sm" onclick="reviewClaim('${c._id}','Approved')">✅ Approve Claim</button>
                  <button class="btn btn-danger btn-sm" onclick="reviewClaim('${c._id}','Rejected')">❌ Reject Claim</button>
                </div>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function reviewClaim(id, status) {
      let reason = '';
      if (status === 'Rejected') {
        reason = prompt('Enter rejection reason for policy holder:') || 'Incomplete documentation';
      }
      const res = await apiRequest(`/insurance/claims/${id}/review`, {
        method: 'PUT',
        body: { status, rejectionReason: reason }
      });
      if (res?.ok) {
        showToast(`Insurance claim ${status} successfully! 🛡️`, status === 'Approved' ? 'success' : 'warning');
        loadInsuranceClaims();
      } else {
        showToast('Failed to update claim status', 'error');
      }
    }
  </script>
</body>
</html>
