<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareLink — Pharmacy Portal</title>
  <meta name="description" content="CareLink Pharmacy Portal: Electronic prescriptions, dosage dispensing, and medicine inventory." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">💊</div>
        <div>
          <div class="logo-text">MediLink AI</div>
          <div class="logo-subtitle">Pharmacy Portal</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a class="nav-item active" href="#">
          <span class="nav-icon">💊</span> E-Prescriptions Queue
        </a>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">P</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">Pharmacist</div>
          <div class="user-role">pharmacy</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Logout">⏻</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <div class="topbar-title">💊 Pharmacy Orders & Dispensing</div>
          <div class="topbar-subtitle">Electronic prescriptions queue from attending doctors</div>
        </div>
      </div>

      <div class="page-content">
        <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 20px;">
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--primary),var(--secondary));">
            <div class="stat-icon">💊</div>
            <div class="stat-value" id="statTotalMeds">0</div>
            <div class="stat-label">Total Prescriptions</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--status-normal),#00b894);">
            <div class="stat-icon">✅</div>
            <div class="stat-value" id="statDispensed" style="color:var(--status-normal)">0</div>
            <div class="stat-label">Dispensed Today</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,var(--warning),#e17055);">
            <div class="stat-icon">⏳</div>
            <div class="stat-value" id="statPending" style="color:var(--warning)">0</div>
            <div class="stat-label">Pending Dispense</div>
          </div>
          <div class="stat-card" style="--card-accent:linear-gradient(90deg,#ff6b9d,#e84393);">
            <div class="stat-icon">📦</div>
            <div class="stat-value" style="color:#ff6b9d">Optimal</div>
            <div class="stat-label">Inventory Status</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">💊 Electronic Prescriptions Queue</div>
            <button class="btn btn-ghost btn-sm" onclick="loadPharmacyPrescriptions()">↻ Refresh Queue</button>
          </div>
          <div id="prescriptionsList" style="display:flex; flex-direction:column; gap:14px;">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth('pharmacy')) return;
      initSidebar();
      loadPharmacyPrescriptions();
    });

    async function loadPharmacyPrescriptions() {
      const res = await apiRequest('/pharmacy/prescriptions');
      const container = document.getElementById('prescriptionsList');
      if (!res || !res.ok || !res.data.length) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">💊</div><div class="empty-text">No active prescriptions in queue</div></div>';
        return;
      }

      const meds = res.data;
      const dispensed = meds.filter(m => m.takenToday).length;
      const pending = meds.length - dispensed;

      document.getElementById('statTotalMeds').textContent = meds.length;
      document.getElementById('statDispensed').textContent = dispensed;
      document.getElementById('statPending').textContent = pending;

      container.innerHTML = meds.map(m => `
        <div class="card" style="background:rgba(17,28,45,0.6); border-left:4px solid ${m.takenToday ? 'var(--status-normal)' : 'var(--warning)'}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <div style="font-size:16px; font-weight:700; color:var(--text-primary);">${m.name} <span style="font-size:13px; color:var(--primary)">(${m.dosage})</span></div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                Patient: <strong>${m.patientId?.name || 'Unknown'}</strong> (Room/Location: ${m.patientId?.roomLocation || 'Home'})
              </div>
              <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">
                Frequency: <strong>${m.frequency}</strong> ${m.instructions ? `• Instructions: "${m.instructions}"` : ''}
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                Prescribed by: 🩺 Dr. ${m.doctorId?.name || 'Attending Physician'}
              </div>
            </div>
            <div>
              ${m.takenToday ? 
                '<span class="badge badge-normal">✅ Dispensed & Sync\'d</span>' : 
                `<button class="btn btn-primary btn-sm" onclick="dispenseMed('${m._id}')">💊 Dispense Medicine</button>`}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function dispenseMed(id) {
      const res = await apiRequest(`/pharmacy/dispense/${id}`, { method: 'PUT' });
      if (res?.ok) {
        showToast('Medication dispensed & logged to patient app! 💊', 'success');
        loadPharmacyPrescriptions();
      } else {
        showToast('Failed to dispense medication', 'error');
      }
    }
  </script>
</body>
</html>
